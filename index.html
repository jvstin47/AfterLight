<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AFTERLIGHT — The machines that stayed behind (Apollo 12)</title>
    <meta name="description" content="An immersive digital archive exploring humanity's abandoned robotic explorers, scientific instruments, and forgotten missions across the Moon. Statio Cognitum, Apollo 12." />
    <meta name="theme-color" content="#010204" />
    <!-- Standard & Legacy Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OpenGraph & Social Sharing Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AFTERLIGHT" />
    <meta property="og:title" content="AFTERLIGHT — The machines that stayed behind" />
    <meta property="og:description" content="An immersive digital archive documenting humanity's abandoned robotic explorers, scientific instruments, and forgotten missions across the Moon." />
    <meta property="og:url" content="https://afterlight.vercel.app/" />
    <meta property="og:image" content="https://afterlight.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AFTERLIGHT Lunar Field Observatory" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AFTERLIGHT — The machines that stayed behind" />
    <meta name="twitter:description" content="An immersive digital archive documenting humanity's abandoned robotic explorers, scientific instruments, and forgotten missions across the Moon." />
    <meta name="twitter:image" content="https://afterlight.vercel.app/og-image.jpg" />

    
    <!-- Modern, High-Legibility Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Design stylesheets -->
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/approach.css" />
    <link rel="stylesheet" href="/src/styles/hud.css" />
    <link rel="stylesheet" href="/src/styles/dossier.css" />
    <link rel="stylesheet" href="/src/styles/traverse.css" />
    <link rel="stylesheet" href="/src/styles/vidicon.css" />
    <link rel="stylesheet" href="/src/styles/expeditions.css" />
    <link rel="stylesheet" href="/src/styles/uiverse.css" />
    <link rel="stylesheet" href="/src/styles/kawai-text.css" />
  </head>
  <body>
    <!-- 3D Three.js Surface Canvas -->
    <canvas id="webgl-canvas" aria-label="3D Interactive Lunar Surface"></canvas>

    <!-- 3D Projected Screen Waypoints -->
    <div id="markers-layer" style="display: none;"></div>

    <!-- UI Overlay Stages -->
    <div id="ui-root">
      <!-- 1969 Surveyor Vidicon Telemetry Overlay -->
      <div id="vidicon-container"></div>

      <!-- Stage A: Approach Sequence -->
      <div id="approach-container"></div>

      <!-- Stage B: Exploration HUD -->
      <div id="hud-container" style="display: none;"></div>

      <!-- Fallback Non-WebGL Layer -->
      <div id="fallback-container" style="display: none;"></div>
    </div>

    <!-- Modals & Drawers (Top Stacking Context above all HUD widgets) -->
    <!-- Stage C: Artifact Dossier Drawer -->
    <div id="dossier-container" style="display: none;"></div>

    <!-- EVA Cartography Modal -->
    <div id="traverse-container" style="display: none;"></div>

    <!-- Lunar Expeditions & Planetary Rovers Modal -->
    <div id="expeditions-container" style="display: none;"></div>

    <!-- Entry Point -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
