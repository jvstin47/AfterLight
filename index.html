<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AFTERLIGHT — The machines that stayed behind (Apollo 12)</title>
    <meta name="description" content="An immersive digital archive exploring humanity's abandoned robotic explorers, scientific instruments, and forgotten missions across the Moon. Statio Cognitum, Apollo 12." />
    <meta name="theme-color" content="#010204" />
    
    <!-- Archival Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet" />

    <!-- Design stylesheets -->
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/approach.css" />
    <link rel="stylesheet" href="/src/styles/hud.css" />
    <link rel="stylesheet" href="/src/styles/dossier.css" />
    <link rel="stylesheet" href="/src/styles/traverse.css" />
    <link rel="stylesheet" href="/src/styles/vidicon.css" />
    <link rel="stylesheet" href="/src/styles/uiverse.css" />
  </head>
  <body>
    <!-- 3D Three.js Surface Canvas -->
    <canvas id="webgl-canvas" aria-label="3D Interactive Lunar Surface"></canvas>

    <!-- 3D Projected Screen Waypoints -->
    <div id="markers-layer" style="display: none;"></div>

    <!-- UI Overlay Stages -->
    <div id="ui-root">
      <!-- 1969 Surveyor Vidicon Telemetry Overlay -->
      <div id="vidicon-container"></div>

      <!-- Stage A: Approach Sequence -->
      <div id="approach-container"></div>

      <!-- Stage B: Exploration HUD -->
      <div id="hud-container" style="display: none;"></div>

      <!-- Fallback Non-WebGL Layer -->
      <div id="fallback-container" style="display: none;"></div>
    </div>

    <!-- Modals & Drawers (Top Stacking Context above all HUD widgets) -->
    <!-- Stage C: Artifact Dossier Drawer -->
    <div id="dossier-container" style="display: none;"></div>

    <!-- EVA Cartography Modal -->
    <div id="traverse-container" style="display: none;"></div>

    <!-- Entry Point -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
