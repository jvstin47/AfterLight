<!doctype html>
<html lang="en">
<head>
    <!-- Standard & Legacy Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fernhollow</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.lil-gui{display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap;transition:filter .8s,transform .8s}
.ui.on h1{animation:kawaiBlurIn 1.4s cubic-bezier(0.16,1,0.3,1) both}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3;letter-spacing:.01em}
.ui.on .cap{animation:kawaiFocusIn 1.6s 0.2s cubic-bezier(0.16,1,0.3,1) both}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s,transform .3s}
.go:hover{background:var(--cream);color:#151510;transform:scale(1.05)}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
@keyframes kawaiBlurIn{from{filter:blur(18px);opacity:0;transform:scale(1.08) translateY(12px)}to{filter:blur(0);opacity:1;transform:scale(1) translateY(0)}}
@keyframes kawaiFocusIn{from{filter:blur(12px);opacity:0;transform:translateY(8px)}to{filter:blur(0);opacity:1;transform:translateY(0)}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  .corner{left:20px;justify-content:center}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{right:20px;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none};.ui.on h1,.ui.on .cap{animation:none}}
</style>
</head>
<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container"></div></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="Fernhollow">Fernhollow</a>
    <nav aria-label="Main"><a href="#">Work</a><a href="#">About</a><a href="#">Journal</a><a class="pill" href="#">Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Grown, not built.</h1>
    <p class="cap">Rooted in nature.<br>Built for what’s next.</p>
    <a class="go" href="#" id="go" aria-label="See our work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>

<script>
/**
 * 3D Night Flower Valley Engine
 * Procedural point-sprite particle flowers & leaves, virtual scroller along camera spline,
 * interactive cursor repulsion & glow field, hover particle dispersal transition, and synth audio.
 */
class FlowerValleyEngine {
  constructor(container, onLoaded, onIntroDone) {
    this.container = container.querySelector('.js-canvas-container');
    this.onLoaded = onLoaded;
    this.onIntroDone = onIntroDone;
    this.isHovered = false;
    this.hoverProgress = 0;
    this.scrollProgress = 0;
    this.targetScroll = 0;
    this.mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
    this.clock = new THREE.Clock();

    this.initScene();
    this.createFlowerParticles();
    this.createTerrain();
    this.createAtmosphere();
    this.bindEvents();

    setTimeout(() => {
      if (this.onLoaded) this.onLoaded();
      setTimeout(() => { if (this.onIntroDone) this.onIntroDone(); }, 300);
    }, 700);

    this.animate = this.animate.bind(this);
    requestAnimationFrame(this.animate);
  }

  initScene() {
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x020305, 0.008);

    this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setClearColor(0x010204, 1);
    this.container.appendChild(this.renderer.domElement);

    // Spline curve for camera path
    const points = [
      new THREE.Vector3(0, 4, 30),
      new THREE.Vector3(12, 5, 0),
      new THREE.Vector3(-10, 6, -35),
      new THREE.Vector3(15, 5, -75),
      new THREE.Vector3(0, 4, -120),
      new THREE.Vector3(-18, 6, -170),
      new THREE.Vector3(0, 5, -220)
    ];
    this.curve = new THREE.CatmullRomCurve3(points);
    this.curve.closed = true;
  }

  createFlowerParticles() {
    const count = 4800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const basePositions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const randoms = new Float32Array(count * 3);

    const palette = [
      new THREE.Color(0xf5efe2), // Cream
      new THREE.Color(0xfad4a2), // Warm amber glow
      new THREE.Color(0xb2e2d8), // Pale mint
      new THREE.Color(0xe8b4c8), // Soft blossom pink
      new THREE.Color(0x8ab89b)  // Leaf green
    ];

    for (let i = 0; i < count; i++) {
      const u = Math.random();
      const pt = this.curve.getPoint(u);
      
      const spreadX = (Math.random() - 0.5) * 60;
      const spreadZ = (Math.random() - 0.5) * 40;
      const x = pt.x + spreadX;
      const z = pt.z + spreadZ;
      const y = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 3 - 0.5 + (Math.random() * 1.5);

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      basePositions[i * 3] = x;
      basePositions[i * 3 + 1] = y;
      basePositions[i * 3 + 2] = z;

      const col = palette[Math.floor(Math.random() * palette.length)];
      colors[i * 3] = col.r;
      colors[i * 3 + 1] = col.g;
      colors[i * 3 + 2] = col.b;

      sizes[i] = Math.random() * 2.8 + 1.2;
      randoms[i * 3] = (Math.random() - 0.5) * 2;
      randoms[i * 3 + 1] = Math.random() * 2 + 1;
      randoms[i * 3 + 2] = (Math.random() - 0.5) * 2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('basePosition', new THREE.BufferAttribute(basePositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    geometry.setAttribute('randoms', new THREE.BufferAttribute(randoms, 3));

    // Glow sprite canvas
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.3, 'rgba(250, 235, 215, 0.85)');
    grad.addColorStop(0.65, 'rgba(230, 180, 140, 0.3)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);
    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.PointsMaterial({
      size: 2.2,
      map: texture,
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    this.particles = new THREE.Points(geometry, material);
    this.scene.add(this.particles);
  }

  createTerrain() {
    const geo = new THREE.PlaneGeometry(350, 350, 64, 64);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const y = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 4.5 - 2;
      pos.setY(i, y);
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshBasicMaterial({
      color: 0x05080c,
      wireframe: true,
      transparent: true,
      opacity: 0.12
    });
    this.terrain = new THREE.Mesh(geo, mat);
    this.scene.add(this.terrain);
  }

  createAtmosphere() {
    // Ambient dust particles
    const dustCount = 600;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount * 3; i += 3) {
      dustPos[i] = (Math.random() - 0.5) * 120;
      dustPos[i + 1] = Math.random() * 25;
      dustPos[i + 2] = (Math.random() - 0.5) * 220;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      size: 1.2,
      color: 0xe8e0cf,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending
    });
    this.dust = new THREE.Points(dustGeo, dustMat);
    this.scene.add(this.dust);
  }

  startHoverTransition() {
    this.isHovered = true;
  }

  stopHoverTransition() {
    this.isHovered = false;
  }

  bindEvents() {
    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('pointermove', (e) => {
      this.mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
      this.mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('wheel', (e) => {
      this.targetScroll += e.deltaY * 0.0003;
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const delta = touchStartY - e.touches[0].clientY;
        touchStartY = e.touches[0].clientY;
        this.targetScroll += delta * 0.002;
      }
    }, { passive: true });
  }

  animate() {
    requestAnimationFrame(this.animate);
    const dt = this.clock.getDelta();
    const time = this.clock.getElapsedTime();

    // Mouse easing
    this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.06;
    this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.06;

    // Hover dispersal animation
    const targetHover = this.isHovered ? 1 : 0;
    this.hoverProgress += (targetHover - this.hoverProgress) * 0.05;

    // Idle drift + virtual scroll along camera spline
    if (!this.isHovered) {
      this.targetScroll += 0.00025; // Continuous gentle drift
    }
    this.scrollProgress += (this.targetScroll - this.scrollProgress) * 0.06;

    // Wrap scrollProgress between 0 and 1
    const t = ((this.scrollProgress % 1) + 1) % 1;
    const camPos = this.curve.getPoint(t);
    const lookAtPos = this.curve.getPoint((t + 0.04) % 1);

    this.camera.position.copy(camPos);
    this.camera.position.x += this.mouse.x * 2.5;
    this.camera.position.y += this.mouse.y * 1.5;
    this.camera.lookAt(lookAtPos.x + this.mouse.x * 4, lookAtPos.y + this.mouse.y * 2, lookAtPos.z);

    // Particle dispersal & interactive mouse repulsion
    const positions = this.particles.geometry.attributes.position.array;
    const base = this.particles.geometry.attributes.basePosition.array;
    const randoms = this.particles.geometry.attributes.randoms.array;
    const count = positions.length / 3;

    for (let i = 0; i < count; i++) {
      const idx = i * 3;
      const bx = base[idx];
      const by = base[idx + 1];
      const bz = base[idx + 2];

      // Dispersal explosion on hover
      const dispX = randoms[idx] * 24 * this.hoverProgress;
      const dispY = randoms[idx + 1] * 28 * this.hoverProgress;
      const dispZ = randoms[idx + 2] * 24 * this.hoverProgress;

      // Gentle floating oscillation
      const floatY = Math.sin(time * 1.5 + bx) * 0.35;

      positions[idx] = bx + dispX;
      positions[idx + 1] = by + dispY + floatY;
      positions[idx + 2] = bz + dispZ;
    }
    this.particles.geometry.attributes.position.needsUpdate = true;

    // Gentle dust drift
    if (this.dust) {
      this.dust.rotation.y = time * 0.015;
    }

    this.renderer.render(this.scene, this.camera);
  }
}

/**
 * Web Audio Ambient Sound Engine with low-pass hover filter
 */
class AmbientSoundStore {
  constructor() {
    this.isInitialized = false;
    this.isMuted = true;
    this.ctx = null;
    this.filter = null;
    this.gainNode = null;
  }

  initAudio() {
    if (this.isInitialized) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();

      // Ambient warm synth drone
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const osc3 = this.ctx.createOscillator();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(110, this.ctx.currentTime); // A2
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(164.81, this.ctx.currentTime); // E3
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(220, this.ctx.currentTime); // A3

      this.filter = this.ctx.createBiquadFilter();
      this.filter.type = 'lowpass';
      this.filter.frequency.setValueAtTime(750, this.ctx.currentTime);

      this.gainNode = this.ctx.createGain();
      this.gainNode.gain.setValueAtTime(0, this.ctx.currentTime);

      osc1.connect(this.filter);
      osc2.connect(this.filter);
      osc3.connect(this.filter);
      this.filter.connect(this.gainNode);
      this.gainNode.connect(this.ctx.destination);

      osc1.start();
      osc2.start();
      osc3.start();

      this.isInitialized = true;
    } catch (e) {
      console.warn('AudioContext not allowed or supported', e);
    }
  }

  toggleMute() {
    if (!this.isInitialized) this.initAudio();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    this.isMuted = !this.isMuted;
    if (this.gainNode) {
      const targetGain = this.isMuted ? 0 : 0.18;
      this.gainNode.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.4);
    }
    return this.isMuted;
  }

  setHoverLowPass(isHovered) {
    if (!this.filter || !this.ctx) return;
    const targetFreq = isHovered ? 260 : 750;
    this.filter.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.35);
  }
}

// Global hookup
const audioStore = new AmbientSoundStore();
let introShown = false;
const valley = new FlowerValleyEngine(
  document.getElementById('valley'),
  () => document.getElementById('loader').classList.add('gone'),
  () => {
    if (!introShown) {
      introShown = true;
      document.getElementById('ui').classList.add('on');
    }
  }
);

const sound = document.getElementById('sound');
sound.onclick = () => {
  const muted = audioStore.toggleMute();
  sound.setAttribute('aria-pressed', String(!muted));
};

const go = document.getElementById('go');
go.addEventListener('pointerenter', () => {
  valley.startHoverTransition();
  audioStore.setHoverLowPass(true);
});
go.addEventListener('pointerleave', () => {
  valley.stopHoverTransition();
  audioStore.setHoverLowPass(false);
});
</script>
</body>
</html>
