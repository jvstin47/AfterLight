<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0d12; }
      .grid { stroke: #1b2230; stroke-width: 1; }
      .title { fill: #e2e8f0; font-family: monospace; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
      .subtitle { fill: #94a3b8; font-family: monospace; font-size: 13px; }
      .blueprint-line { stroke: #38bdf8; stroke-width: 1.5; fill: none; }
      .accent-line { stroke: #f59e0b; stroke-width: 2; fill: none; }
      .gold-foil { fill: rgba(245, 158, 11, 0.15); stroke: #f59e0b; stroke-width: 1.5; }
      .engine { stroke: #ef4444; stroke-width: 2; fill: rgba(239, 68, 68, 0.1); }
      .tank { stroke: #10b981; stroke-width: 1.5; fill: rgba(16, 185, 129, 0.1); }
      .label { fill: #cbd5e1; font-family: monospace; font-size: 11px; }
      .dimension { fill: #38bdf8; font-family: monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="1000" height="800" class="bg"/>
  <!-- Grid -->
  <g class="grid">
    <path d="M0,100 H1000 M0,200 H1000 M0,300 H1000 M0,400 H1000 M0,500 H1000 M0,600 H1000 M0,700 H1000"/>
    <path d="M100,0 V800 M200,0 V800 M300,0 V800 M400,0 V800 M500,0 V800 M600,0 V800 M700,0 V800 M800,0 V800 M900,0 V800"/>
  </g>
  <!-- Headers -->
  <text x="50" y="55" class="title">APOLLO 12 LUNAR MODULE (LM-6 INTREPID)</text>
  <text x="50" y="78" class="subtitle">DESCENT STAGE SUB-SYSTEM ARCHITECTURE &amp; ARTIFACT PROFILE</text>
  <rect x="750" y="40" width="200" height="50" fill="#111827" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="760" y="60" class="subtitle">SITE: 3.0124°S, 23.4216°W</text>
  <text x="760" y="78" class="subtitle">STATUS: PERMANENT LUNAR</text>

  <!-- Descent Stage Octagonal Body -->
  <polygon points="380,260 620,260 700,340 700,500 620,580 380,580 300,500 300,340" class="gold-foil"/>
  <rect x="390" y="280" width="220" height="280" fill="none" stroke="#64748b" stroke-dasharray="4,4"/>

  <!-- DPS Engine (Center) -->
  <circle cx="500" cy="420" r="65" class="engine"/>
  <circle cx="500" cy="420" r="25" fill="#ef4444" opacity="0.4"/>
  <text x="500" y="424" class="label" text-anchor="middle">TRW DPS ENGINE</text>

  <!-- Propellant Tanks -->
  <!-- Fuel Tank 1 (Quad 1) -->
  <circle cx="420" cy="350" r="38" class="tank"/>
  <text x="420" y="354" class="label" text-anchor="middle">AEROZINE 50</text>
  <!-- Oxidizer Tank 1 (Quad 2) -->
  <circle cx="580" cy="350" r="38" class="tank"/>
  <text x="580" y="354" class="label" text-anchor="middle">N2O4 OXIDIZER</text>
  <!-- Fuel Tank 2 (Quad 3) -->
  <circle cx="420" cy="490" r="38" class="tank"/>
  <text x="420" y="494" class="label" text-anchor="middle">AEROZINE 50</text>
  <!-- Oxidizer Tank 2 (Quad 4) -->
  <circle cx="580" cy="490" r="38" class="tank"/>
  <text x="580" y="494" class="label" text-anchor="middle">N2O4 OXIDIZER</text>

  <!-- 4 Landing Gear Legs -->
  <!-- Forward Leg (Ladder / Quad 1) -->
  <line x1="380" y1="260" x2="170" y2="130" class="blueprint-line" stroke-width="4"/>
  <circle cx="170" cy="130" r="18" fill="#38bdf8"/>
  <line x1="170" y1="130" x2="130" y2="100" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="90" class="label">LUNAR SURFACE SENSING PROBE (1.68m)</text>
  <!-- Ladder & Plaque -->
  <rect x="220" y="160" width="40" height="8" fill="#e2e8f0" transform="rotate(32 220 160)"/>
  <rect x="240" y="175" width="40" height="8" fill="#e2e8f0" transform="rotate(32 240 175)"/>
  <text x="200" y="230" class="accent-line" style="fill:#f59e0b">EGRESS LADDER &amp; COMMEMORATIVE PLAQUE</text>

  <!-- Quad 2 Leg (Right Forward) -->
  <line x1="620" y1="260" x2="830" y2="130" class="blueprint-line" stroke-width="4"/>
  <circle cx="830" cy="130" r="18" fill="#38bdf8"/>
  <!-- MESA Bay -->
  <rect x="650" y="290" width="40" height="50" fill="#3b82f6" opacity="0.3" stroke="#38bdf8"/>
  <text x="710" y="320" class="label">QUAD II: MESA (TV CAMERA / ROCK BOXES)</text>

  <!-- Quad 3 Leg (Right Aft) -->
  <line x1="620" y1="580" x2="830" y2="710" class="blueprint-line" stroke-width="4"/>
  <circle cx="830" cy="710" r="18" fill="#38bdf8"/>

  <!-- Quad 4 Leg (Left Aft) -->
  <line x1="380" y1="580" x2="170" y2="710" class="blueprint-line" stroke-width="4"/>
  <circle cx="170" cy="710" r="18" fill="#38bdf8"/>
  <!-- ALSEP Bay & SNAP-27 Cask -->
  <rect x="310" y="510" width="45" height="45" fill="#f59e0b" opacity="0.4" stroke="#f59e0b"/>
  <circle cx="290" cy="560" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="70" y="555" class="label">SNAP-27 GRAPHITE CASK</text>
  <text x="70" y="575" class="label">(PLUTONIUM-238 FUEL TRANSPORT)</text>
  <text x="70" y="600" class="label">QUAD IV: ALSEP SUBPACKAGES 1 &amp; 2</text>

  <!-- Dimension indicators -->
  <line x1="170" y1="760" x2="830" y2="760" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="170" y1="750" x2="170" y2="770" stroke="#38bdf8" stroke-width="1"/>
  <line x1="830" y1="750" x2="830" y2="770" stroke="#38bdf8" stroke-width="1"/>
  <text x="500" y="755" class="dimension" text-anchor="middle">DIAGONAL FOOTPRINT SPAN: 9.45 METERS (31 FEET)</text>
</svg>